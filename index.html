<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモンタイプじゃんけん</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="images/icon-512.png">
</head>

<body>
    <div class="app-container">
        <header class="game-header">
            <h1>ポケモンタイプじゃんけん</h1>
            <p id="instruction-text">バトルモードをえらぼう！</p>
        </header>

        <main id="game-area">
            <!-- Mode Selection Screen (Local vs Online) -->
            <div id="mode-selection-screen" class="screen active">
                <div class="mode-selection-container">
                    <div class="mode-buttons">
                        <button id="local-mode-btn" class="mode-btn local-btn">
                            <span class="mode-icon">🎮</span>
                            <span class="mode-title">ローカル<br>バトル</span>
                            <span class="mode-desc">ちかくのともだちと！</span>
                        </button>
                        <button id="online-mode-btn" class="mode-btn online-btn">
                            <span class="mode-icon">🌐</span>
                            <span class="mode-title">オンライン<br>バトル</span>
                            <span class="mode-desc">はなれたともだちと！</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Online Room Screen -->
            <div id="online-room-screen" class="screen hidden">
                <div class="online-room-container">
                    <div style="max-width: 500px; margin: 0 auto; text-align: left; margin-bottom: 20px;">
                        <button id="back-to-mode-btn" class="back-btn">← もどる</button>
                    </div>

                    <div class="room-actions">
                        <div class="room-action-card">
                            <h3>おへやをつくる</h3>
                            <p>ともだちにあいことばをおしえよう</p>
                            <input type="text" id="created-room-id-input" placeholder="あいことば" readonly
                                style="background-color: #f0f0f0; color: #555;">
                            <button id="create-room-btn" class="action-btn create-btn">おへやをつくる</button>
                        </div>

                        <div class="room-action-card">
                            <h3>おへやにはいる</h3>
                            <p>ともだちのあいことばをいれよう</p>
                            <input type="text" id="room-id-input" placeholder="あいことば" maxlength="20">
                            <button id="join-room-btn" class="action-btn join-btn">はいる</button>
                        </div>
                    </div>

                    <!-- Connection Status -->
                    <div id="connection-status" class="connection-status hidden">
                        <div class="status-indicator">
                            <span id="status-icon" class="status-icon">⏳</span>
                            <span id="status-text">せつぞくちゅう...</span>
                        </div>
                        <div id="room-id-display" class="room-id-display hidden">
                            <p>あいことば:</p>
                            <span id="display-room-id" class="room-id-code"></span>
                            <button id="copy-room-id-btn" class="copy-btn">コピー</button>
                        </div>
                        <button id="cancel-connection-btn" class="cancel-btn hidden">キャンセル</button>
                    </div>
                </div>
            </div>
            <!-- Rule Setting Screen -->
            <div id="rule-setting-screen" class="screen hidden">
                <div class="rule-setting-container">
                    <div style="max-width: 500px; margin: 0 auto; text-align: left; margin-bottom: 20px;">
                        <button id="back-to-mode-from-rules-btn" class="back-btn">← もどる</button>
                    </div>

                    <h2 class="section-title">バトルのルールをきめよう</h2>

                    <div class="rule-sections">
                        <div class="rule-card">
                            <h3>ゲームモード</h3>
                            <select id="mode-select">
                                <option value="full">フルモード (じゆうにえらぶ)</option>
                                <option value="omakase">おまかせモード (ランダム)</option>
                                <option value="type">タイプモード (タイプをえらぶ)</option>
                            </select>
                            <p class="rule-hint" id="mode-hint">すべてのポケモンからじゆうにえらべます</p>
                        </div>

                        <div id="rule-filter-settings" class="rule-card">
                            <h3>しばり設定（すべてのプレイヤー）</h3>

                            <div class="rule-accordion-group" id="region-accordion-group">
                                <div class="rule-accordion-header accordion-trigger"
                                    data-target="region-accordion-content">
                                    <label class="rule-section-label">ちほう</label>
                                    <div class="header-actions">
                                        <button type="button" class="bulk-btn toggle-bulk-btn"
                                            data-target="rule-region-checkboxes">全解除</button>
                                        <span class="accordion-icon"></span>
                                    </div>
                                </div>
                                <div class="rule-accordion-content" id="region-accordion-content">
                                    <div class="checkbox-grid" id="rule-region-checkboxes">
                                        <label class="checkbox-item"><input type="checkbox" value="gen1"
                                                checked>カントー</label>
                                        <label class="checkbox-item"><input type="checkbox" value="gen2"
                                                checked>ジョウト</label>
                                        <label class="checkbox-item"><input type="checkbox" value="gen3"
                                                checked>ホウエン</label>
                                        <label class="checkbox-item"><input type="checkbox" value="gen4"
                                                checked>シンオウ</label>
                                        <label class="checkbox-item"><input type="checkbox" value="gen5"
                                                checked>イッシュ</label>
                                        <label class="checkbox-item"><input type="checkbox" value="gen6"
                                                checked>カロス</label>
                                        <label class="checkbox-item"><input type="checkbox" value="gen6_za"
                                                checked>カロス(ZA)</label>
                                        <label class="checkbox-item"><input type="checkbox" value="gen7"
                                                checked>アローラ</label>
                                        <label class="checkbox-item"><input type="checkbox" value="gen8"
                                                checked>ガラル</label>
                                        <label class="checkbox-item"><input type="checkbox" value="gen9"
                                                checked>パルデア</label>
                                        <label class="checkbox-item"><input type="checkbox" value="hisui"
                                                checked>ヒスイ</label>
                                        <label class="checkbox-item"><input type="checkbox" value="unknown"
                                                checked>その他</label>
                                    </div>
                                </div>
                            </div>
                            <div class="rule-accordion-group" id="type-accordion-group">
                                <div class="rule-accordion-header accordion-trigger"
                                    data-target="type-accordion-content">
                                    <label class="rule-section-label">タイプ</label>
                                    <div class="header-actions">
                                        <button type="button" class="bulk-btn toggle-bulk-btn"
                                            data-target="rule-type-checkboxes">全解除</button>
                                        <span class="accordion-icon"></span>
                                    </div>
                                </div>
                                <div class="rule-accordion-content" id="type-accordion-content">
                                    <div class="checkbox-grid" id="rule-type-checkboxes">
                                        <label class="checkbox-item"><input type="checkbox" value="normal"
                                                checked>ノーマル</label>
                                        <label class="checkbox-item"><input type="checkbox" value="fire"
                                                checked>ほのお</label>
                                        <label class="checkbox-item"><input type="checkbox" value="water"
                                                checked>みず</label>
                                        <label class="checkbox-item"><input type="checkbox" value="electric"
                                                checked>でんき</label>
                                        <label class="checkbox-item"><input type="checkbox" value="grass"
                                                checked>くさ</label>
                                        <label class="checkbox-item"><input type="checkbox" value="ice"
                                                checked>こおり</label>
                                        <label class="checkbox-item"><input type="checkbox" value="fighting"
                                                checked>かくとう</label>
                                        <label class="checkbox-item"><input type="checkbox" value="poison"
                                                checked>どく</label>
                                        <label class="checkbox-item"><input type="checkbox" value="ground"
                                                checked>じめん</label>
                                        <label class="checkbox-item"><input type="checkbox" value="flying"
                                                checked>ひこう</label>
                                        <label class="checkbox-item"><input type="checkbox" value="psychic"
                                                checked>エスパー</label>
                                        <label class="checkbox-item"><input type="checkbox" value="bug"
                                                checked>むし</label>
                                        <label class="checkbox-item"><input type="checkbox" value="rock"
                                                checked>いわ</label>
                                        <label class="checkbox-item"><input type="checkbox" value="ghost"
                                                checked>ゴースト</label>
                                        <label class="checkbox-item"><input type="checkbox" value="dragon"
                                                checked>ドラゴン</label>
                                        <label class="checkbox-item"><input type="checkbox" value="dark"
                                                checked>あく</label>
                                        <label class="checkbox-item"><input type="checkbox" value="steel"
                                                checked>はがね</label>
                                        <label class="checkbox-item"><input type="checkbox" value="fairy"
                                                checked>フェアリー</label>
                                    </div>
                                </div>
                            </div>
                        </div>


                        <div id="type-mode-settings" class="rule-card hidden">
                            <h3>タイプモード ルール</h3>
                            <div class="type-rule-item">
                                <div class="rule-info">
                                    <span class="rule-name">バトルのタイプ数</span>
                                    <span class="rule-desc" id="battle-rule-desc">1つか2つのタイプでたたかいます</span>
                                </div>
                                <label class="switch">
                                    <input type="checkbox" id="battle-rule-toggle" checked>
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="type-rule-item" id="constraint-selector-wrapper">
                                <div class="rule-info">
                                    <span class="rule-name">せんたくルール</span>
                                    <span class="rule-desc" id="constraint-desc">1タイプだけでもOK</span>
                                </div>
                                <label class="switch">
                                    <input type="checkbox" id="constraint-toggle">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="rule-confirm-actions">
                        <button id="start-selection-btn" class="action-btn next-btn">このルールで はじめる！</button>
                    </div>
                </div>
            </div>

            <!-- Pokemon Selection Grid -->
            <div id="selection-screen" class="screen hidden">
                <div class="search-toggle-header">
                    <button id="back-to-rules-btn" class="back-btn-small">← ルールをかえる</button>
                    <button id="toggle-search-btn" class="toggle-search-btn collapsed" onclick="toggleSearchSettings()">
                        <span>条件（じょうけん）で さがす</span>
                        <span id="toggle-icon">▼</span>
                    </button>
                </div>
                <div id="search-settings-container" class="search-settings-container collapsed">
                    <div class="name-inputs">
                        <div class="name-input-group" id="player1-name-group">
                            <label for="player1-name">トレーナー 1</label>
                            <input type="text" id="player1-name" placeholder="おなまえ" maxlength="10">
                        </div>
                        <div class="name-input-group hidden" id="player2-name-group">
                            <label for="player2-name">トレーナー 2</label>
                            <input type="text" id="player2-name" placeholder="おなまえ" maxlength="10">
                        </div>
                    </div>
                    <div class="pokemon-search-container">
                        <div class="filter-controls">
                            <select id="region-filter">
                                <option value="all">すべてのちほう</option>
                                <option value="gen1">カントー (1-151)</option>
                                <option value="gen2">ジョウト (152-251)</option>
                                <option value="gen3">ホウエン (252-386)</option>
                                <option value="gen4">シンオウ (387-493)</option>
                                <option value="gen5">イッシュ (494-649)</option>
                                <option value="gen6">カロス (650-721)</option>
                                <option value="gen6_za">カロス地方(ZA)</option>
                                <option value="gen7">アローラ (722-807)</option>
                                <option value="unknown">不明 (808-809)</option>
                                <option value="gen8">ガラル (810-905)</option>
                                <option value="gen9">パルデア (906-)</option>
                                <option value="hisui">ヒスイ</option>
                            </select>
                            <div class="type-filters-wrapper">
                                <select id="type1-filter">
                                    <option value="all">タイプ1 (すべて)</option>
                                    <option value="normal">ノーマル</option>
                                    <option value="fire">ほのお</option>
                                    <option value="water">みず</option>
                                    <option value="electric">でんき</option>
                                    <option value="grass">くさ</option>
                                    <option value="ice">こおり</option>
                                    <option value="fighting">かくとう</option>
                                    <option value="poison">どく</option>
                                    <option value="ground">じめん</option>
                                    <option value="flying">ひこう</option>
                                    <option value="psychic">エスパー</option>
                                    <option value="bug">むし</option>
                                    <option value="rock">いわ</option>
                                    <option value="ghost">ゴースト</option>
                                    <option value="dragon">ドラゴン</option>
                                    <option value="dark">あく</option>
                                    <option value="steel">はがね</option>
                                    <option value="fairy">フェアリー</option>
                                </select>
                                <select id="type2-filter">
                                    <option value="all">タイプ2 (すべて)</option>
                                    <option value="none">なし</option>
                                    <option value="normal">ノーマル</option>
                                    <option value="fire">ほのお</option>
                                    <option value="water">みず</option>
                                    <option value="electric">でんき</option>
                                    <option value="grass">くさ</option>
                                    <option value="ice">こおり</option>
                                    <option value="fighting">かくとう</option>
                                    <option value="poison">どく</option>
                                    <option value="ground">じめん</option>
                                    <option value="flying">ひこう</option>
                                    <option value="psychic">エスパー</option>
                                    <option value="bug">むし</option>
                                    <option value="rock">いわ</option>
                                    <option value="ghost">ゴースト</option>
                                    <option value="dragon">ドラゴン</option>
                                    <option value="dark">あく</option>
                                    <option value="steel">はがね</option>
                                    <option value="fairy">フェアリー</option>
                                </select>
                            </div>
                        </div>
                        <input type="text" id="pokemon-search" placeholder="ポケモンのなまえでけんさく" autocomplete="off">
                        <div id="search-suggestions" class="search-suggestions hidden"></div>
                    </div>
                </div>
                <div class="pokemon-grid" id="pokemon-grid">
                    <!-- Javascript will populate this -->
                </div>
                <div class="type-selection-grid hidden" id="type-selection-grid">
                    <button type="button" class="type-btn" data-type="normal">ノーマル</button>
                    <button type="button" class="type-btn" data-type="fire">ほのお</button>
                    <button type="button" class="type-btn" data-type="water">みず</button>
                    <button type="button" class="type-btn" data-type="electric">でんき</button>
                    <button type="button" class="type-btn" data-type="grass">くさ</button>
                    <button type="button" class="type-btn" data-type="ice">こおり</button>
                    <button type="button" class="type-btn" data-type="fighting">かくとう</button>
                    <button type="button" class="type-btn" data-type="poison">どく</button>
                    <button type="button" class="type-btn" data-type="ground">じめん</button>
                    <button type="button" class="type-btn" data-type="flying">ひこう</button>
                    <button type="button" class="type-btn" data-type="psychic">エスパー</button>
                    <button type="button" class="type-btn" data-type="bug">むし</button>
                    <button type="button" class="type-btn" data-type="rock">いわ</button>
                    <button type="button" class="type-btn" data-type="ghost">ゴースト</button>
                    <button type="button" class="type-btn" data-type="dragon">ドラゴン</button>
                    <button type="button" class="type-btn" data-type="dark">あく</button>
                    <button type="button" class="type-btn" data-type="steel">はがね</button>
                    <button type="button" class="type-btn" data-type="fairy">フェアリー</button>
                    <div class="type-random-buttons">
                        <button type="button" class="type-random-btn" id="random-type-btn">おまかせ</button>
                    </div>
                    <button type="button" class="type-confirm-btn" id="type-confirm-btn">けってい</button>
                </div>
            </div>

            <!-- Battle Screen -->
            <div id="battle-screen" class="screen hidden">
                <div class="battle-arena">
                    <div class="fighter player">
                        <p class="player-name" id="player1-label">トレーナー 1</p>
                        <div class="fighter-card" id="player-fighter"></div>
                        <p class="pokemon-name" id="player1-pokemon-name"></p>
                        <p class="pokemon-types" id="player1-types"></p>
                        <p class="pokemon-multiplier" id="player1-multiplier"></p>
                        <div class="multiplier-process" id="player1-process"></div>
                    </div>
                    <div class="vs-badge">VS</div>
                    <div class="fighter cpu">
                        <p class="player-name" id="player2-label">トレーナー 2</p>
                        <div class="fighter-card" id="cpu-fighter"></div>
                        <p class="pokemon-name" id="player2-pokemon-name"></p>
                        <p class="pokemon-types" id="player2-types"></p>
                        <p class="pokemon-multiplier" id="player2-multiplier"></p>
                        <div class="multiplier-process" id="player2-process"></div>
                    </div>
                </div>
                <!-- View Result Button -->
                <div style="text-align: center; margin-top: 30px;">
                    <button id="view-result-btn" class="action-btn hidden"
                        style="background: #ff5722; color: white; border: none; padding: 15px 40px; font-size: 1.2rem; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,87,34,0.4); transition: transform 0.2s; width: auto;">
                        かちまけをみる！
                    </button>
                </div>
                <div id="result-display" class="result-display hidden">
                    <h2 id="result-message"></h2>
                    <div class="result-action-buttons">
                        <button id="restart-btn" class="btn-primary">もういちどあそぶ</button>
                        <button id="return-to-start-btn" class="btn-primary"
                            style="background-color: #757575;">さいしょにもどる</button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <p>made for sia v2.1.3</p>
        </footer>
    </div>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
